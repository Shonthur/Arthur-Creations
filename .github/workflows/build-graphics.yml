name: Build graphics gallery

# Runs by itself when you add, change or delete a PDF in graphics-src/
on:
  push:
    branches: [main]
    paths:
      - "graphics-src/**"
      - "scripts/build_graphics.py"
  workflow_dispatch:   # also lets you press "Run workflow" by hand in the Actions tab

permissions:
  contents: write

# Only one build at a time, so several uploads in a row do not clash
concurrency:
  group: build-graphics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install pillow

      - name: Convert PDFs to HD images
        run: python scripts/build_graphics.py

      - name: Save the new images to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/graphics
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Update graphics gallery images"
            git pull --rebase origin main
            git push
          fi
