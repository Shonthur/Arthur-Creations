*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;color:#fff;font-family:"Inter",system-ui,sans-serif;
background:radial-gradient(800px 500px at 80% 10%,rgba(49,130,206,.22),transparent 60%),radial-gradient(700px 480px at 10% 100%,rgba(56,161,105,.14),transparent 60%),#142a37}
.stage{display:flex;align-items:center;gap:clamp(14px,3vw,30px);padding:0 24px}
.mk{height:clamp(86px,17vw,150px);flex:none}
.mk svg{height:100%;width:auto;display:block;overflow:visible}
.mk path{fill:#fff}
.tx{font-family:"Montserrat",sans-serif;line-height:1}
.tx b{display:block;font-weight:700;font-size:clamp(2rem,8.6vw,4.4rem);letter-spacing:.03em;opacity:0;animation:rise .9s cubic-bezier(.22,.61,.36,1) 1.15s forwards}
.tx i{display:block;font-style:normal;font-weight:500;font-size:clamp(.5rem,2.3vw,1.13rem);letter-spacing:.14em;margin-top:.7em;opacity:0;animation:rise .9s cubic-bezier(.22,.61,.36,1) 1.45s forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes peak{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
@keyframes leg{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes swoosh{0%{opacity:0;transform:translate(-120px,120px)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:none}50%{transform:translate(8px,-8px)}}
.av-peak{animation:peak .9s cubic-bezier(.22,.61,.36,1) both}
.av-leg{animation:leg .9s cubic-bezier(.22,.61,.36,1) .15s both}
.av-swoosh{animation:swoosh 1.2s cubic-bezier(.22,.61,.36,1) .35s both,float 2.4s ease-in-out 1.6s infinite}
.bar{position:fixed;left:50%;bottom:64px;width:min(240px,60vw);height:3px;transform:translateX(-50%);background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden;opacity:0;animation:rise .6s ease 1.8s forwards}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#3182ce,#38a169);animation:fill 3s linear 1.8s forwards}
@keyframes fill{to{width:100%}}
.skip{position:fixed;top:22px;right:22px;color:#fff;text-decoration:none;font-weight:500;font-size:.9rem;padding:10px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);opacity:0;animation:rise .6s ease 1s forwards;transition:background .2s}
.skip:hover,.skip:focus-visible{background:rgba(255,255,255,.22)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
